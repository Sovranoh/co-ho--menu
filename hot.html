<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOIR COFFEE | Hot Drinks</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#0b0b0b;
font-family:Poppins,sans-serif;
color:white;

}

.header{

padding:25px;
display:flex;
align-items:center;
gap:15px;

}

.back{

text-decoration:none;
color:white;
font-size:30px;

}

.title h1{

font-size:30px;

}

.title p{

font-family:Cairo;
color:#999;

}

.menu{

padding:20px;
display:flex;
flex-direction:column;
gap:18px;

}

.card{

background:#171717;
border-radius:22px;
padding:18px;
display:flex;
align-items:center;
gap:18px;
cursor:pointer;
transition:.25s;

}

.card:hover{

transform:scale(1.02);

}

.card img{

width:85px;
height:85px;
border-radius:50%;
object-fit:cover;

}

.info{

flex:1;

}

.info h2{

font-size:20px;

}

.info h3{

font-family:Cairo;
font-weight:500;
color:#cfcfcf;
margin-top:5px;

}

.price{

margin-top:8px;
font-size:18px;
font-weight:600;

}

.modal{

position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
display:none;
justify-content:center;
align-items:center;
padding:20px;

}

.popup{

background:#161616;
width:100%;
max-width:360px;
border-radius:25px;
padding:25px;
text-align:center;

}

.popup img{

width:170px;
height:170px;
border-radius:50%;
object-fit:cover;
margin-bottom:20px;

}

.popup h2{

font-size:28px;

}

.popup h3{

font-family:Cairo;
color:#ccc;
margin-top:8px;

}

.desc-en{

margin-top:18px;
color:#bdbdbd;
font-size:15px;
line-height:28px;

}

.desc-ar{

margin-top:10px;
font-family:Cairo;
color:#8d8d8d;
font-size:15px;
line-height:30px;
direction:rtl;

}

.popup button{

margin-top:25px;
width:100%;
padding:14px;
border:none;
border-radius:15px;
background:white;
color:black;
font-weight:600;
font-size:17px;
cursor:pointer;

}

</style>

</head>

<body>

<div class="header">

<a href="index.html" class="back">←</a>

</div>

</div>

</div>
