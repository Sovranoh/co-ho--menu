<!DOCTYPE html>
<html lang="ar" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOIR COFFEE | Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d0d0d;
      font-family: 'Poppins', sans-serif;
      color: white;
      padding-top: calc(env(safe-area-inset-top) + 20px);
      padding-bottom: 40px;
    }

    .container {
      width: 90%;
      max-width: 420px;
      margin: auto;
      padding: 20px 0;
    }

    .header-main {
      text-align: center;
      margin-bottom: 35px;
    }

    .header-main h1 {
      font-size: 32px;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .header-main p {
      font-family: 'Cairo', sans-serif;
      color: #888;
      margin-top: 5px;
      font-size: 15px;
    }

    .menu-categories {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .category-card {
      background: #181818;
      border-radius: 20px;
      padding: 22px 25px;
      text-decoration: none;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #2a2a2a;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .category-card:hover {
      transform: translateY(-3px);
      border-color: #c8a96a;
    }

    .category-info h2 {
      font-size: 22px;
      font-weight: 600;
    }

    .category-info p {
      font-family: 'Cairo', sans-serif;
      margin-top: 4px;
      color: #aaa;
      font-size: 15px;
    }

    .arrow {
      font-size: 22px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Header Section -->
    <div class="header-main">
      <h1>NOIR COFFEE</h1>
      <p>القائمة الرئيسية | Main Menu</p>
    </div>

    <!-- Main Categories -->
    <div class="menu-categories">

      <!-- Hot Drinks Link -->
      <a href="hot-drinks.html" class="category-card">
        <div class="category-info">
          <h2>Hot Drinks</h2>
          <p>المشروبات الحارة</p>
        </div>
        <span class="arrow">→</span>
      </a>

      <!-- Iced Drinks Link -->
      <a href="iced-drinks.html" class="category-card">
        <div class="category-info">
          <h2>Iced Drinks</h2>
          <p>المشروبات الباردة</p>
        </div>
        <span class="arrow">→</span>
      </a>

      <!-- Manual Brew V60 Link -->
      <a href="v60.html" class="category-card">
        <div class="category-info">
          <h2>Manual Brew V60</h2>
          <p>التقطير اليدوي V60</p>
        </div>
        <span class="arrow">→</span>
      </a>

    </div>

  </div>

</body>

</html>
