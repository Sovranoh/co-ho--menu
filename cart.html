<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات - NOIR CAFFE</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="content">
        <div class="container">
            <div class="cart-container">
                <h2>سلة المشتريات</h2>
                
                <!-- مكان عرض المنتجات -->
                <div id="cart-items"></div>

                <!-- المجموع الكلي -->
                <div class="cart-summary">
                    <h3>المجموع الكلي: <span id="total-price">$0.00</span></h3>
                    <div class="table-input-container" style="margin-bottom: 15px;">
    <label for="table-number" style="display: block; margin-bottom: 5px; font-size: 0.9rem; color: #aaa;">رقم الطاولة أو المكان:</label>
    <input type="text" id="table-number" placeholder="مثال: طاولة رقم 4 أو تيك أواي" style="width: 100%; padding: 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; outline: none;">
</div>

                    <button id="checkout-btn">تأكيد الطلب</button>
                </div>

                <br>
                <a href="index.html" class="cart-link" style="text-align: center; display: block;">← العودة إلى القائمة</a>
            </div>
        </div>
    </div>

    <!-- ملف الجافا سكربت الخاص بالسلة -->
    <script src="cart.js"></script>
</body>
</html>
